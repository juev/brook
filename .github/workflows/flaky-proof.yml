name: Flaky proof

# TEMPORARY: branch-only proof that the gated regression test fails on the old order and passes on
# the fixed one. Remove this workflow, and the push trigger, with the branch.
on:
  workflow_dispatch:
  push:
    branches: [hermes/brook-test-lifecycle]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_CLASS: org.evsyukov.brook.ui.reader.ReaderViewModelTest
      TEST_METHOD: aTextTurnedOffWhileTheStoreReturnsStaysOff
      READER: app/src/main/java/org/evsyukov/brook/ui/reader/ReaderViewModel.kt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Record what is proved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "class=$TEST_CLASS"
            echo "method=$TEST_METHOD"
          } | tee proof/meta.txt
          git diff --exit-code -- "$READER"
          sha256sum "$READER" | tee proof/file.sha256
      - name: Run the whole class on the fixed code (green)
        shell: bash
        run: |
          set -uo pipefail
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$TEST_CLASS" 2>&1 | tee proof/green.log
          status=${PIPESTATUS[0]}
          mkdir -p proof/green
          cp -r app/build/test-results/testDebugUnitTest proof/green/results 2>/dev/null || true
          cp -r app/build/reports proof/green/reports 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::the class is not green on the fixed code"
            exit "$status"
          fi
          python3 -I .github/scripts/check-test-results.py green \
            --results app/build/test-results/testDebugUnitTest \
            --source-root app/src/test/java \
            --tests "$TEST_CLASS" 2>&1 | tee proof/green/check.txt
      - name: Put the choice back after the store (the old order)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/org/evsyukov/brook/ui/reader/ReaderViewModel.kt")
          fixed = (
              "                if (entryIdFlow.value == id) fullTextChoice.value = true\n"
              "                storeFullText(id, html)\n"
          )
          old = (
              "                storeFullText(id, html)\n"
              "                if (entryIdFlow.value == id) fullTextChoice.value = true\n"
          )
          text = path.read_text(encoding="utf-8")
          if text.count(fixed) != 1:
              raise SystemExit("the fixed order was not found exactly once")
          path.write_text(text.replace(fixed, old), encoding="utf-8")
          print("mutated: the choice is written after the store")
          PY
          git diff --stat -- "$READER"
      - name: Run the gated test on the old order (red)
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$TEST_CLASS.$TEST_METHOD" 2>&1 | tee proof/red.log
          status=${PIPESTATUS[0]}
          mkdir -p proof/red
          cp -r app/build/test-results/testDebugUnitTest proof/red/results 2>/dev/null || true
          cp -r app/build/reports proof/red/reports 2>/dev/null || true
          python3 -I .github/scripts/check-test-results.py red \
            --results app/build/test-results/testDebugUnitTest \
            --class "$TEST_CLASS" --method "$TEST_METHOD" 2>&1 | tee proof/red/check.txt
          check=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "::error::the old order passed the gated test"
            exit 1
          fi
          if [ "$check" -ne 0 ]; then
            echo "::error::the failure was not the intended assertion"
            exit "$check"
          fi
      - name: Restore the exact file
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- "$READER"
          git diff --exit-code -- "$READER"
          sha256sum -c proof/file.sha256
      - name: Run the whole class on the restored code (green)
        shell: bash
        run: |
          set -uo pipefail
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$TEST_CLASS" 2>&1 | tee proof/green-restored.log
          status=${PIPESTATUS[0]}
          mkdir -p proof/green-restored
          cp -r app/build/test-results/testDebugUnitTest proof/green-restored/results 2>/dev/null || true
          cp -r app/build/reports proof/green-restored/reports 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::the restored code is not green"
            exit "$status"
          fi
          python3 -I .github/scripts/check-test-results.py green \
            --results app/build/test-results/testDebugUnitTest \
            --source-root app/src/test/java \
            --tests "$TEST_CLASS" 2>&1 | tee proof/green-restored/check.txt
      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-proof
          path: proof/
          if-no-files-found: warn
