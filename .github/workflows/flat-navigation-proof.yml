name: Flat feed navigation proof

# Temporary proof for the flat feed navigation of #54. It runs only for
# hermes/flat-feed-navigation and must be removed once the change is merged.
on:
  push:
    branches: [hermes/flat-feed-navigation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flat-navigation-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GREEN, mutation, RED, restore, GREEN. Every phase executes Gradle for real: the test task is
  # rerun, its results are deleted first, and no build or configuration cache is used. A phase that
  # runs no test or skips one fails the checker, and a mutation that leaves the suite green fails too.
  unit-proof:
    if: github.ref == 'refs/heads/hermes/flat-feed-navigation' || github.head_ref == 'hermes/flat-feed-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROOF_CLASS: org.evsyukov.brook.ui.home.NavTreeTest
      PROOF_METHOD: unreadModeListsOnlyFeedsWithUnreadEntries
      # The test asserts this text with Truth's assertWithMessage, so the red run fails on this
      # assertion and not on a compile error, a timeout, or a setup error.
      PROOF_MARKER: FLAT_UNREAD_MUST_EXCLUDE_FEEDS_WITHOUT_UNREAD
      # The only line the mutation touches: the Unread branch of NavTree.feedsFor.
      MUTATED_FILE: app/src/main/java/org/evsyukov/brook/ui/home/NavTree.kt
      MUTATION_FROM: '    Filter.UNREAD -> feeds.filter { it.unread > 0 }'
      MUTATION_TO: '    Filter.UNREAD -> feeds // MUTATION: the Unread picker includes every feed, the old behaviour'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Record what is proved
        shell: bash
        run: |
          mkdir -p evidence/pristine
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$GITHUB_REF"
            echo "test=$PROOF_CLASS.$PROOF_METHOD"
            echo "marker=$PROOF_MARKER"
            echo "mutation=$MUTATION_FROM -> $MUTATION_TO"
            java -version 2>&1 | head -n 1
          } | tee evidence/meta.txt
          cp "$MUTATED_FILE" evidence/pristine/NavTree.kt
          sha256sum "$MUTATED_FILE" | tee evidence/pristine/NavTree.sha256

      # GREEN 1: the whole class, all methods, none skipped.
      - name: Green before the mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/01-green
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$PROOF_CLASS" 2>&1 | tee evidence/01-green/gradle.log
          cp -r app/build/test-results/testDebugUnitTest evidence/01-green/results
          python3 -I .github/scripts/check-test-results.py green \
            --results app/build/test-results/testDebugUnitTest \
            --source-root app/src/test/java \
            --tests "$PROOF_CLASS" 2>&1 | tee evidence/01-green/check.txt

      # MUTATION: Unread keeps every feed again, as the old picker did. The new symbols stay, so the
      # suite compiles and only the behaviour assertion changes.
      - name: Apply the mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/02-red
          python3 -I - "$MUTATED_FILE" <<'PY' 2>&1 | tee evidence/02-red/mutation.txt
          import os
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          old = os.environ["MUTATION_FROM"]
          new = os.environ["MUTATION_TO"]
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected one match of the mutation point, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if cmp -s "$MUTATED_FILE" evidence/pristine/NavTree.kt; then
            echo "::error::the mutation changed nothing"
            exit 1
          fi

      # RED: exactly the intended test, exactly the intended assertion. Gradle must fail, and the
      # checker must find one java.lang.AssertionError carrying PROOF_MARKER. The XML is kept.
      - name: Red under the mutation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/03-red
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$PROOF_CLASS.$PROOF_METHOD" 2>&1 | tee evidence/03-red/gradle.log
          status=${PIPESTATUS[0]}
          cp -r app/build/test-results/testDebugUnitTest evidence/03-red/results 2>/dev/null || true
          cp -r app/build/reports evidence/03-red/reports 2>/dev/null || true
          if [ "$status" -eq 0 ]; then
            echo "::error::the suite stayed green under the mutation"
            exit 1
          fi
          python3 -I .github/scripts/check-test-results.py red \
            --results app/build/test-results/testDebugUnitTest \
            --class "$PROOF_CLASS" \
            --method "$PROOF_METHOD" \
            --marker "$PROOF_MARKER" 2>&1 | tee evidence/03-red/check.txt

      # RESTORE: byte for byte from the saved copy, checked by the recorded SHA-256. It runs even
      # when the red phase failed, so a broken proof never leaves the mutation in the tree.
      - name: Restore the source byte for byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/04-restore
          cp evidence/pristine/NavTree.kt "$MUTATED_FILE"
          sha256sum -c evidence/pristine/NavTree.sha256 2>&1 | tee evidence/04-restore/check.txt
          cmp -s evidence/pristine/NavTree.kt "$MUTATED_FILE"
          echo "restored $MUTATED_FILE to its pre-mutation bytes" | tee -a evidence/04-restore/check.txt

      # GREEN 2: the restored tree again, all methods, none skipped.
      - name: Green after the restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/05-green
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            testDebugUnitTest --rerun --tests "$PROOF_CLASS" 2>&1 | tee evidence/05-green/gradle.log
          cp -r app/build/test-results/testDebugUnitTest evidence/05-green/results
          python3 -I .github/scripts/check-test-results.py green \
            --results app/build/test-results/testDebugUnitTest \
            --source-root app/src/test/java \
            --tests "$PROOF_CLASS" 2>&1 | tee evidence/05-green/check.txt

      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flat-navigation-unit-proof
          path: evidence/
          if-no-files-found: warn

  # The real Compose UI on an emulator: taps, long press, menu dismissal, sheet dismissal, scope
  # persistence, and screenshots taken from the rendered screen and pulled off the device.
  device-proof:
    if: github.ref == 'refs/heads/hermes/flat-feed-navigation' || github.head_ref == 'hermes/flat-feed-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the feed navigation tests and pull the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # One line: the action runs each line of `script` in a separate shell, so the two passes,
          # their trap and their exit statuses live in the checked script shared with ci.yml.
          script: bash .github/scripts/run-device-tests.sh
      - name: Keep the device proof and the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flat-navigation-device-proof
          path: |
            device-evidence/
            app/build/reports/androidTests/
          if-no-files-found: warn
