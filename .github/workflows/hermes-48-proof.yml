name: hermes-48-proof

# TEMPORARY proof for issue #48. It runs only on the pull request from
# hermes/brook-link-gestures and is meant to be removed by the parent after the
# RED/GREEN evidence has been observed. It does not replace the canonical CI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    if: github.event.pull_request.head.ref == 'hermes/brook-link-gestures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Focused GREEN before the mutation
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest \
            --tests 'org.evsyukov.brook.ui.reader.ReaderLinkTest' \
            --tests 'org.evsyukov.brook.ui.reader.ReaderGestureTest' \
            --tests 'org.evsyukov.brook.ui.reader.ReaderPageTest' \
            --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache --rerun-tasks \
            2>&1 | tee green.log

      - name: Keep the GREEN XML
        if: always()
        run: |
          mkdir -p proof-results/green
          cp app/build/test-results/testDebugUnitTest/*.xml proof-results/green/ 2>/dev/null || true

      - name: Keep the production file
        run: cp app/src/main/java/org/evsyukov/brook/ui/reader/ReaderScreen.kt "$RUNNER_TEMP/ReaderScreen.kt.green"

      - name: Mutate only the tap dispatch back to the old chooser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/org/evsyukov/brook/ui/reader/ReaderScreen.kt")
          text = path.read_text()
          old = "context.startActivity(linkIntent(url))"
          new = "context.startActivity(linkChooser(url))"
          assert text.count(old) == 1, f"expected one dispatch, found {text.count(old)}"
          path.write_text(text.replace(old, new))
          PY

      - name: RED — the tap must fail as a chooser
        id: red
        run: |
          set +e
          # A compile failure must not leave the GREEN results where the RED ones are read.
          rm -rf app/build/test-results/testDebugUnitTest
          ./gradlew testDebugUnitTest \
            --tests 'org.evsyukov.brook.ui.reader.ReaderLinkTest.aTapStartsTheDefaultAppForTheLink' \
            --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache --rerun-tasks \
            2>&1 | tee red.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "gradle exit $status"

      - name: Keep the RED XML
        if: always()
        run: |
          mkdir -p proof-results/red
          cp app/build/test-results/testDebugUnitTest/*.xml proof-results/red/ 2>/dev/null || true

      - name: Check the RED is the intended assertion
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/build/test-results/testDebugUnitTest/TEST-org.evsyukov.brook.ui.reader.ReaderLinkTest.xml"
          root = ET.parse(path).getroot()
          tests = root.findall("testcase")
          assert len(tests) == 1, f"expected exactly one test, got {len(tests)}"
          test = tests[0]
          assert test.get("name") == "aTapStartsTheDefaultAppForTheLink", test.get("name")
          assert root.get("skipped", "0") == "0", "the test was skipped"
          assert root.get("errors", "0") == "0", "the test errored instead of failing"
          failures = test.findall("failure")
          assert len(failures) == 1, f"expected one failure, got {len(failures)}"
          failure = failures[0]
          kind = failure.get("type") or ""
          # Truth 1.4.5 with JUnit reports a comparison failure as this Platform subclass, whose
          # name does not contain "AssertionError". Nothing else is an acceptable RED.
          allowed = {
              "java.lang.AssertionError",
              "com.google.common.truth.Platform$ComparisonFailureWithFacts",
          }
          assert kind in allowed, f"unexpected failure type: {kind}"
          message = (failure.get("message") or "") + "\n" + (failure.text or "")
          assert "CHOOSER" in message and "VIEW" in message, message[:500]
          assert "ReaderLinkTest" in message, message[:500]
          print("RED confirmed:", failure.get("message"))
          PY
          status="${{ steps.red.outputs.status }}"
          if [ "$status" = "0" ]; then
            echo "Gradle passed; the mutation did not prove RED"
            exit 1
          fi

      - name: Restore the exact production file
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ReaderScreen.kt.green" ]; then
            cp "$RUNNER_TEMP/ReaderScreen.kt.green" app/src/main/java/org/evsyukov/brook/ui/reader/ReaderScreen.kt
          fi

      - name: Focused GREEN after the restore
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest \
            --tests 'org.evsyukov.brook.ui.reader.ReaderLinkTest' \
            --tests 'org.evsyukov.brook.ui.reader.ReaderGestureTest' \
            --tests 'org.evsyukov.brook.ui.reader.ReaderPageTest' \
            --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache --rerun-tasks \
            2>&1 | tee green-after.log

      - name: Keep the GREEN-after XML
        if: always()
        run: |
          mkdir -p proof-results/green-after
          cp app/build/test-results/testDebugUnitTest/*.xml proof-results/green-after/ 2>/dev/null || true

      - name: Upload logs and test XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-48-proof
          path: |
            green.log
            red.log
            green-after.log
            proof-results/**/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
